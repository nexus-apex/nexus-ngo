{% extends "base.html" %}
{% block title %}{% if editing %}Edit{% else %}New{% endif %} Donor | NexusNGO{% endblock %}
{% block page_title %}{% if editing %}Edit Donor{% else %}New Donor{% endif %}{% endblock %}
{% block content %}
<div class="card" style="max-width:750px">
  <form method="post">
    {% csrf_token %}
    <div class="form-row">
      <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" value="{{ record.name|default:'' }}">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ record.email|default:'' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone" value="{{ record.phone|default:'' }}">
      </div>
      <div class="form-group">
        <label>Total Donated</label>
        <input type="number" step="0.01" name="total_donated" value="{{ record.total_donated|default:'0' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Donations Count</label>
        <input type="number" name="donations_count" value="{{ record.donations_count|default:'0' }}">
      </div>
      <div class="form-group">
        <label>Donor Type</label>
        <select name="donor_type">
          <option value="individual" {% if record.donor_type == 'individual' %}selected{% endif %}>Individual</option>
          <option value="corporate" {% if record.donor_type == 'corporate' %}selected{% endif %}>Corporate</option>
          <option value="foundation" {% if record.donor_type == 'foundation' %}selected{% endif %}>Foundation</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          <option value="active" {% if record.status == 'active' %}selected{% endif %}>Active</option>
          <option value="lapsed" {% if record.status == 'lapsed' %}selected{% endif %}>Lapsed</option>
        </select>
      </div>
      <div class="form-group">
        <label>Last Donation</label>
        <input type="date" name="last_donation" value="{{ record.last_donation|date:'Y-m-d'|default:'' }}">
      </div>
    </div>

    <div style="display:flex;gap:0.75rem;margin-top:1rem">
      <button type="submit" class="btn btn-primary">{% if editing %}Update{% else %}Create{% endif %} Donor</button>
      <a href="/donors/" class="btn" style="background:var(--border);color:var(--text)">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
